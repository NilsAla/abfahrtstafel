; Abfahrtstafel – PlatformIO-Konfiguration
; Referenz-Build ist GitHub Actions (.github/workflows/build.yml).
;
; Environments:
;   esp32s3  Firmware für Waveshare ESP32-S3-LCD-3.16
;   native   Unit-Tests der board-unabhängigen Logik in lib/ (pio test -e native)
;   sim      Headless-Rendering der UI (scripts/render_screens.py → docs/screens/)
;   bringup  nur Display-Testbild direkt in den Framebuffer, ohne LVGL und restlichen Stack

[platformio]
default_envs = esp32s3

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
; Versionen exakt gepinnt: ein Release muss reproduzierbar gebaut werden können.
lib_deps =
    bblanchon/ArduinoJson@7.4.2

; LVGL für Firmware und Simulator, Konfiguration in include/lv_conf.h
[lvgl]
lib_deps = lvgl/lvgl@9.3.0
build_flags = -DLV_CONF_INCLUDE_SIMPLE -I include

[env:esp32s3]
; pioarduino = arduino-esp32 3.3.12 (Waveshare verlangt >= 3.1.0). Version bewusst gepinnt.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

; RGB-Panel stabil bei Flash-Schreibzugriffen (NVS, WLAN-Daten, OTA). Der Arduino-Core baut den S3 ohne
; LCD_RGB_ISR_IRAM_SAFE: Ist der Cache beim Flash-Schreiben aus, verpasst die Bounce-Buffer-ISR EOF-Interrupts und das
; Bild bleibt um genau einen Bounce-Buffer (41 Zeilen) zyklisch versetzt – die Treiber-Resynchronisierung fängt den Fall
; „CPU hinkt hinterher“ nicht ab. XIP aus dem PSRAM hält Code und PSRAM während Flash-Ops erreichbar, damit die ISR
; weiter aus dem Framebuffer kopieren kann (Espressif-Doku RGB-LCD, Bounce-Buffer + PSRAM-Framebuffer).
; Hybrid-Compile (pioarduino): baut den Core mit diesen Optionen neu, CI dauert dadurch länger.
custom_sdkconfig =
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y

build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    ${lvgl.build_flags}

build_src_filter = +<*> -<sim/> -<bringup/>

lib_deps =
    ${env.lib_deps}
    ${lvgl.lib_deps}
    esp32async/AsyncTCP@3.5.0
    esp32async/ESPAsyncWebServer@3.11.2
    tzapu/WiFiManager@2.0.17

extra_scripts =
    pre:scripts/version.py
    pre:scripts/embed_web.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -DUNIT_TEST
    -Wall
    -Wextra

[env:sim]
; Nativer Build der UI ohne Hardware. Ergebnis: .pio/build/sim/program
platform = native
build_src_filter = +<ui/> +<sim/>
build_flags =
    ${env.build_flags}
    ${lvgl.build_flags}
    -O1
lib_deps =
    ${env.lib_deps}
    ${lvgl.lib_deps}

[env:bringup]
; Hardware-Bring-up (M0.5): nur src/board und src/bringup. Flashen: pio run -e bringup -t upload
extends = env:esp32s3
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
build_src_filter = +<board/> +<bringup/>
lib_deps =
extra_scripts = pre:scripts/version.py
