; Abfahrtstafel – PlatformIO-Konfiguration
; Referenz-Build ist GitHub Actions (.github/workflows/build.yml).
;
; Environments:
;   esp32s3  Firmware für Waveshare ESP32-S3-LCD-3.16
;   native   Unit-Tests der board-unabhängigen Logik in lib/ (pio test -e native)
;   sim      (ab M4) Headless-Rendering der UI als PNG
;   bringup  (ab M0.5) nur Display-Testbild, ohne restlichen Stack

[platformio]
default_envs = esp32s3

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
; Versionen exakt gepinnt: ein Release muss reproduzierbar gebaut werden können.
lib_deps =
    bblanchon/ArduinoJson@7.4.2

[env:esp32s3]
; pioarduino = arduino-esp32 3.3.12 (Waveshare verlangt >= 3.1.0). Version bewusst gepinnt.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    ${env.lib_deps}
    esp32async/AsyncTCP@3.5.0
    esp32async/ESPAsyncWebServer@3.11.2
    tzapu/WiFiManager@2.0.17

extra_scripts =
    pre:scripts/version.py
    pre:scripts/embed_web.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -DUNIT_TEST
    -Wall
    -Wextra

; [env:sim]      -> M4
; [env:bringup]  -> M0.5
