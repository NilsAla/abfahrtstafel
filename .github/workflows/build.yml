name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: PlatformIO installieren
        run: pip install --upgrade platformio

      - name: Unit-Tests (native)
        run: pio test -e native

      - name: Firmware bauen
        run: pio run -e esp32s3

      - name: Artefakte prüfen
        run: |
          ls -l .pio/build/esp32s3/firmware.bin .pio/build/esp32s3/firmware.factory.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            .pio/build/esp32s3/firmware.bin
            .pio/build/esp32s3/firmware.factory.bin
          retention-days: 14
