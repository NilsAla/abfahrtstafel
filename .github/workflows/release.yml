name: Release

# Normalfall: lokal mit scripts/release.sh (baut auf dem Rechner, veröffentlicht per gh). Dieser Workflow ist der Weg
# ohne Toolchain (Cloud-Session) und startet nur manuell. Ein lokal gepushter Tag löst ihn bewusst nicht aus.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v, z. B. 0.1.0 (Bindestrich = Pre-Release)"
        required: true
      notes:
        description: "Release-Notes (kurz, erscheinen auch auf dem Gerät)"
        required: false
        default: ""
      selftest_fail:
        description: "Test-Build: Selbsttest schlägt absichtlich fehl → Rollback (nur zum Testen!)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version bestimmen
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          NOTES="${INPUT_NOTES}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Ungültige Version '$VERSION'"; exit 1
          fi
          case "$VERSION" in *-*) PRE=true ;; *) PRE=false ;; esac
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} existiert bereits"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<__NOTES__"
            echo "$NOTES"
            echo "__NOTES__"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: PlatformIO installieren
        run: |
          pip install --upgrade platformio
          # pioarduino baut im eigenen venv (~/.platformio/penv) ein zweites Mal und installiert dort
          # "pioarduino>=6.2.0" – Version 6.2.0.post1 gilt als Semver-Vorabversion und lehnt die
          # Plattform ab (IncompatiblePlatform). Vorab 6.2.0 einsetzen, dann wird nicht nachinstalliert.
          python -m venv ~/.platformio/penv
          ~/.platformio/penv/bin/pip install --quiet "pioarduino==6.2.0"

      - name: Unit-Tests (native)
        run: pio test -e native

      - name: Firmware bauen
        env:
          FW_VERSION: ${{ steps.ver.outputs.version }}
          PLATFORMIO_BUILD_FLAGS: ${{ inputs.selftest_fail && '-DFW_SELFTEST_FAIL' || '' }}
        run: |
          if [ -n "$PLATFORMIO_BUILD_FLAGS" ]; then echo "::warning::Test-Build mit $PLATFORMIO_BUILD_FLAGS"; fi
          pio run -e esp32s3

      - name: Release-Dateien erzeugen
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          NOTES: ${{ steps.ver.outputs.notes }}
        run: python3 scripts/release_files.py "$VERSION" "$GITHUB_REPOSITORY" "$NOTES"

      - name: GitHub-Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.ver.outputs.version }}
          body: ${{ steps.ver.outputs.notes }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          make_latest: ${{ steps.ver.outputs.prerelease == 'false' }}
          files: |
            dist/firmware.bin
            dist/firmware-factory.bin
            dist/manifest.json
            dist/firmware.elf
          fail_on_unmatched_files: true

      # Beta-Kanal: Geräte mit „Beta-Versionen erhalten“ lesen …/releases/download/beta/manifest.json.
      # Das Sammel-Release „beta“ enthält nur dieses Manifest; es zeigt auf die neueste Version, egal ob Beta oder
      # stabil, damit Beta-Geräte auch reguläre Releases bekommen. Ein älterer Hotfix ersetzt keine neuere Beta.
      - name: Beta-Kanal aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta --prerelease --latest=false --target "$GITHUB_SHA" --title "Beta-Kanal" \
              --notes "Technisches Sammel-Release für Geräte im Beta-Kanal. Enthält nur manifest.json; die Firmware liegt im jeweiligen Versions-Release."
          fi
          gh release download beta --pattern manifest.json --output beta-current.json 2>/dev/null || true
          if python3 scripts/beta_newer.py "$VERSION" beta-current.json
          then
            gh release upload beta dist/manifest.json --clobber
            echo "Beta-Kanal zeigt jetzt auf $VERSION"
          else
            echo "Beta-Kanal unverändert (enthält bereits eine neuere Version)"
          fi
